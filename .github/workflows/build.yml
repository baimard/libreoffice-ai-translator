name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        run: make build
      - name: Upload OXT
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-ai-translator-oxt
          path: dist/libreoffice-ai-translator.oxt
